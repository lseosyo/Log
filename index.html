<script>
  var d = new Date();
  function render() {
    renderCal();
    renderTodo();
    paintLog();
    if (logSelSync) logSelSync();
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    var s = d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' (' + ['일', '월', '화', '수', '목', '금', '토'][d.getDay()] + ')';
    document.getElementById('date').textContent = s;
    document.getElementById('logdate').textContent = s;
  }
  function renderCal() {
    var y = d.getFullYear(), m = d.getMonth(), today = new Date();
    var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    var h = '<table><tr>';
    ['일', '월', '화', '수', '목', '금', '토'].forEach(function (w, i) {
      h += '<th' + (i === 0 ? ' class="sun"' : i === 6 ? ' class="sat"' : '') + '>' + w + '</th>';
    });
    h += '</tr><tr>';
    for (var q = 0; q < 42; q++) {
      var n = q - first + 1, wd = q % 7, cls = [], dt = new Date(y, m, n), inM = n >= 1 && n <= days;
      if (q > 0 && wd === 0) h += '</tr><tr>';
      if (wd === 0) cls.push('sun');
      if (wd === 6) cls.push('sat');
      if (!inM) cls.push('out');
      if (dn(dt) === dn(today)) cls.push('today');
      if (inM && n === d.getDate()) cls.push('sel');
      h += '<td class="' + cls.join(' ') + '" data-t="' + dn(dt) + '"><span>' + dt.getDate() + '</span></td>';
    }
    h += '</tr></table>';
    document.getElementById('cal').innerHTML = h;
  }
  document.getElementById('cal').addEventListener('click', function (e) {
    var c = e.target.closest && e.target.closest('td');
    var n = c && c.getAttribute('data-t');
    if (n) { n = parseInt(n, 10); d = new Date(Math.floor(n / 10000), Math.floor(n / 100) % 100 - 1, n % 100); render(); }
  });
  function move(n) { d = new Date(d.getFullYear(), d.getMonth() + n, 1); render(); }
  document.getElementById('date').addEventListener('click', function () { d = new Date(); render(); });
  document.getElementById('prev').addEventListener('click', function () { move(-1); });
  document.getElementById('next').addEventListener('click', function () { move(1); });
  var store = {};
  try { store = JSON.parse(localStorage.getItem('todos') || '{}') || {}; } catch (e) { store = {}; }
  var syncHook = null;
  var boxIdx = null, boxMv = false, boxEdit = null, logSelSync = null;
  function touch() { try { localStorage.setItem('syncDirty', '1'); } catch (e) {} if (syncHook) syncHook(); }
  function save() { try { localStorage.setItem('todos', JSON.stringify(store)); } catch (e) {} touch(); }
  var repeats = [];
  try { repeats = JSON.parse(localStorage.getItem('repeats') || '[]') || []; } catch (e) { repeats = []; }
  function saveR() { try { localStorage.setItem('repeats', JSON.stringify(repeats)); } catch (e) {} touch(); }
  function dn(x) { return x.getFullYear() * 10000 + (x.getMonth() + 1) * 100 + x.getDate(); }
  function repsFor(x) {
    var n = dn(x), w = x.getDay();
    return repeats.filter(function (r) { return r.days.indexOf(w) >= 0 && n >= r.start && (!r.end || n <= r.end) && !(r.skip && r.skip[n]); });
  }
  function prevDn(x) { return dn(new Date(x.getFullYear(), x.getMonth(), x.getDate() - 1)); }
  function cutFrom(r, n) {
    // 반복 시리즈를 n일부터 잘라낸다 (n 이전 기록은 유지)
    if (r.start >= n) { var i = repeats.indexOf(r); if (i >= 0) repeats.splice(i, 1); }
    else r.end = prevDn(new Date(Math.floor(n / 10000), Math.floor(n / 100) % 100 - 1, n % 100));
  }
  function askScope(title, opts, cb) {
    var box = document.getElementById('sbtn');
    document.getElementById('stitle').textContent = title;
    box.innerHTML = '';
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = o.label;
      if (o.cls) b.className = o.cls;
      b.addEventListener('click', function () {
        document.getElementById('ov5').classList.remove('open');
        if (o.val) cb(o.val);
      });
      box.appendChild(b);
    });
    document.getElementById('ov5').classList.add('open');
  }
  document.getElementById('ov5').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.getElementById('ov5').classList.remove('open'); });
  document.getElementById('days').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (b) b.classList.toggle('on');
  });
  function dkey() { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function catOf(t) {
    var cs = document.querySelectorAll('.cat'), i, nm, col = cc(t.color);
    for (i = 0; i < cs.length; i++) if (t.cat && cs[i].getAttribute('data-cat') === t.cat) return t.cat;
    for (i = 0; i < cs.length; i++) if (col && cc(cs[i].querySelector('.dot').style.backgroundColor) === col) return cs[i].getAttribute('data-cat');
    return '할일';
  }
  function renderTodo() {
    var uls = {};
    document.querySelectorAll('.cat').forEach(function (c) { var u = c.querySelector('.clist'); u.innerHTML = ''; uls[c.getAttribute('data-cat')] = u; });
    var list = (store[dkey()] || []).map(function (t, i) { return { t: t, i: i, rep: false }; }).concat(repsFor(d).map(function (r) {
      return { t: { text: r.text, memo: r.memo, time: r.time, color: r.color, cat: r.cat, done: !!(r.done && r.done[dn(d)]), r: r }, rep: true };
    }));
    var dirtyS = false, dirtyR = false;
    list.forEach(function (it, pos) {
      var o = it.rep ? it.t.r : it.t;
      if (!o.id) { o.id = uid(); if (it.rep) dirtyR = true; else dirtyS = true; }
      it.id = o.id; it.pos = pos;
    });
    if (dirtyS) save();
    if (dirtyR) saveR();
    var ord = orders[dkey()] || [];
    list.sort(function (a, b) {
      var ia = ord.indexOf(a.id), ib = ord.indexOf(b.id);
      return (ia < 0 ? 1e6 + a.pos : ia) - (ib < 0 ? 1e6 + b.pos : ib);
    });
    list = list.filter(function (x) { return !x.t.done; }).concat(list.filter(function (x) { return x.t.done; }));
    list.forEach(function (it) {
      var t = it.t, i = it.i;
      var li = document.createElement('li');
      li.dataset.id = it.id;
      attachDrag(li);
      if (t.done) li.className = 'done';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!t.done;
      var cl = cc(t.color); if (cl) cb.style.setProperty('--c', cl);
      cb.addEventListener('change', function () {
        if (it.rep) { it.t.r.done = it.t.r.done || {}; it.t.r.done[dn(d)] = cb.checked; saveR(); }
        else { t.done = cb.checked; save(); }
        if (cb.checked) {
          var ids = [], byId = {};
          document.querySelectorAll('.clist li').forEach(function (n) { ids.push(n.dataset.id); });
          list.forEach(function (x) { byId[x.id] = x; });
          var from = ids.indexOf(it.id), last = -1;
          ids.splice(from, 1);
          ids.forEach(function (id, ix) { if (catOf(byId[id].t) === catOf(t)) last = ix; });
          ids.splice(last < 0 ? from : last + 1, 0, it.id);
          orders[dkey()] = ids;
          saveO();
        }
        renderTodo();
      });
      var sp = document.createElement('span');
      var ts = document.createElement('span');
      ts.className = 'tt';
      ts.textContent = t.text;
      sp.appendChild(ts);
      if (t.time) {
        var tm = document.createElement('small');
        tm.textContent = t.time;
        tm.style.display = 'block';
        tm.style.opacity = '.6';
        sp.appendChild(tm);
      }
      if (t.memo) {
        var mm = document.createElement('small');
        mm.textContent = t.memo;
        mm.style.display = 'block';
        mm.style.whiteSpace = 'pre-wrap';
        mm.style.opacity = '.6';
        sp.appendChild(mm);
      }
      var x = document.createElement('button');
      x.className = 'del';
      x.textContent = '×';
      x.setAttribute('aria-label', '삭제');
      x.addEventListener('click', function () {
        if (it.rep) { repeats.splice(repeats.indexOf(it.t.r), 1); saveR(); }
        else { store[dkey()].splice(i, 1); save(); }
        renderTodo();
      });
      li.appendChild(cb);
      li.appendChild(sp);
      li.addEventListener('click', function (e) { if (justDragged) return; if (e.target !== cb) openDetail(it); });
      uls[catOf(t)].appendChild(li);
    });
  }
  var lg = document.getElementById('logs');
  for (var hr = 0; hr < 24; hr++) {
    var row = document.createElement('div');
    row.className = 'hrow';
    var hn = document.createElement('span');
    hn.className = 'hnum';
    hn.textContent = (hr < 10 ? '0' : '') + hr;
    var hp = document.createElement('div');
    hp.className = 'hpill';
    hp.setAttribute('data-h', hr);
    var ms = document.createElement('div');
    ms.className = 'mseg';
    for (var mn = 0; mn < 60; mn++) {
      var mc = document.createElement('i');
      mc.setAttribute('data-m', mn);
      ms.appendChild(mc);
    }
    hp.appendChild(ms);
    for (var tk = 10; tk < 60; tk += 10) {
      var tick = document.createElement('b');
      tick.className = 'tick';
      tick.style.left = (tk / 60 * 100) + '%';
      hp.appendChild(tick);
    }
    row.appendChild(hn);
    row.appendChild(hp);
    lg.appendChild(row);
  }
  function paintLog() {
    var now = new Date(), nd = dn(now), sd = dn(d), nh = now.getHours(), nm = now.getMinutes();
    document.querySelectorAll('.hpill').forEach(function (p) {
      var h = +p.getAttribute('data-h');
      var past = sd < nd || (sd === nd && h < nh), curH = sd === nd && h === nh;
      p.classList.toggle('future', !past);
      p.querySelectorAll('.mseg i').forEach(function (s, m) { s.classList.toggle('on', curH && m <= nm); });
    });
  }
  setInterval(paintLog, 30000);
  function paintT(id) {
    var el = document.getElementById(id), v = document.getElementById(id.replace('t', 'v')), n = el._fill || 0;
    var s = (el.value.replace(/\D/g, '') + '0000').slice(0, 4), h = '';
    for (var i = 0; i < 4; i++) {
      if (i === 2) h += '<span class="' + (n > 2 ? 'k' : 'g') + '">:</span>';
      h += '<span class="' + (i < n ? 'k' : 'g') + '">' + s.charAt(i) + '</span>';
    }
    v.innerHTML = h;
  }
  function fmtT(v) {
    var p = ('0000' + v.replace(/\D/g, '')).slice(-4), h = Math.min(23, parseInt(p.slice(0, 2), 10)), m = Math.min(59, parseInt(p.slice(2), 10));
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  function checkTime() {
    var s = document.getElementById('tstart').value.replace(':', ''), e = document.getElementById('tend').value.replace(':', '');
    document.getElementById('terr').textContent = (s.length === 4 && e.length === 4 && e < s) ? '종료 시간이 시작 시간보다 빠릅니다.' : '';
  }
  ['tstart', 'tend'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('input', function (e) {
      var dg = el._dg || [];
      if (e.inputType && e.inputType.indexOf('delete') === 0) {
        dg.pop();
      } else if (e.data) {
        e.data.replace(/\D/g, '').split('').forEach(function (c) {
          if (dg.length >= 4) dg = [];
          dg.push(c);
        });
      } else {
        dg = el.value.replace(/\D/g, '').slice(0, 4).split('');
      }
      if (dg.length >= 2 && parseInt(dg[0] + dg[1], 10) > 23) { dg[0] = '2'; dg[1] = '3'; }
      if (dg.length >= 4 && parseInt(dg[2] + dg[3], 10) > 59) { dg[2] = '5'; dg[3] = '9'; }
      el._dg = dg;
      el._fill = dg.length;
      var s = (dg.join('') + '0000').slice(0, 4);
      el.value = s.slice(0, 2) + ':' + s.slice(2);
      paintT(el.id);
      var cp = dg.length <= 2 ? dg.length : dg.length + 1;
      el.setSelectionRange(cp, cp);
      checkTime();
      if (el.id === 'tstart' && dg.length === 4 && e.data) document.getElementById('tend').focus();
    });
    el.addEventListener('focus', function () { el._dg = []; setTimeout(function () { el.setSelectionRange(0, 0); }, 0); });
    el.addEventListener('click', function () { var n = (el._dg || []).length, p = n <= 2 ? n : n + 1; el.setSelectionRange(p, p); });
    el.addEventListener('dragstart', function (e) { e.preventDefault(); });
    el.addEventListener('drop', function (e) { e.preventDefault(); });
    el.addEventListener('blur', function () {
      var q = el.value.replace(/\D/g, ''), pad = function (x) { return (x < 10 ? '0' : '') + x; };
      el.value = pad(Math.min(23, parseInt(q.slice(0, 2), 10) || 0)) + ':' + pad(Math.min(59, parseInt(q.slice(2, 4), 10) || 0));
      paintT(el.id);
      checkTime();
    });
  });
  ['memo', 'time', 'rep'].forEach(function (n) {
    var sw = document.getElementById('sw' + n), f = document.getElementById('f' + n);
    sw.addEventListener('change', function () { f.classList.toggle('open', sw.checked); });
  });
  var cur = null;
  function openSheet(p) {
    editing = null;
    boxEdit = null;
    document.getElementById('sheet').classList.remove('boxmode');
    cur = p ? { color: p.querySelector('.dot').style.backgroundColor, name: p.childNodes[1].textContent } : { color: '' };
    document.getElementById('ttitle').value = '';
    document.getElementById('tmemo').value = '';
    ['tstart', 'tend'].forEach(function (id) { var el = document.getElementById(id); el.value = '00:00'; el._dg = []; el._fill = 0; paintT(id); });
    ['memo', 'time', 'rep'].forEach(function (n) {
      document.getElementById('sw' + n).checked = false;
      document.getElementById('f' + n).classList.remove('open');
    });

    function saveCfg() {
      var u = urlEl.value.trim();
      if (u !== (ls('syncUrl') || '')) { ls('syncBase', '0'); ls('syncDirty', '1'); }
      ls('syncUrl', u);
    }
    urlEl.addEventListener('change', saveCfg);
    async function call(body) {
      var res = await fetch(ls('syncUrl'), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      var j = await res.json();
      if (!j || !j.ok) throw new Error((j && j.error) || 'error');
      return j;
    }
    async function push() {
      var p = { todos: store, repeats: repeats, orders: orders, box: box, logcats: window.__log ? window.__log.get() : {} }, at = Date.now();
      ls('syncDirty', '0');
      try { await call({ action: 'set', data: p, updatedAt: at }); } catch (e) { ls('syncDirty', '1'); throw e; }
      ls('syncBase', String(at));
      say('마지막 동기화: ' + stamp(at));
    }
    function pull(r) {
      var x = r.data || {};
      store = x.todos || {}; repeats = x.repeats || []; orders = x.orders || {}; box = x.box || [];
      if (window.__log) window.__log.set(x.logcats || {});
      ls('box', JSON.stringify(box)); renderBox();
      ls('todos', JSON.stringify(store)); ls('repeats', JSON.stringify(repeats)); ls('orders', JSON.stringify(orders));
      ls('syncBase', String(r.updatedAt)); ls('syncDirty', '0');
      render();
      say('시트에서 가져왔어요. (' + stamp(r.updatedAt) + ')');
    }
    function fail(e) {
      say('동기화에 실패했어요. URL·배포 설정(액세스: 모든 사용자)을 확인해 주세요.');
    }
    async function sync() {
      if (busy) return;
      if (!ready()) { say('웹 앱 URL(…/exec)을 입력해 주세요.'); return; }
      saveCfg();
      busy = true; btn.disabled = true; say('동기화 중…');
      var conflict = null;
      try {
        var r = await call({ action: 'get' });
        if (!r.exists) r = null;
        var base = +ls('syncBase') || 0, dirty = ls('syncDirty') === '1';
        if (!r) await push();
        else if (r.updatedAt === base) {
          if (dirty) await push(); else say('이미 최신이에요. (' + stamp(base) + ')');
        }
        else if (base && !dirty) pull(r);
        else if (!base && isEmpty()) pull(r);
        else conflict = r;
      } catch (e) { fail(e); }
      busy = false; btn.disabled = false;
      if (conflict) {
        say('이 기기와 시트의 내용이 서로 달라요.');
        askScope('어느 쪽 데이터를 사용할까요?', [
          { label: '이 기기 데이터를 시트에 저장', cls: 'pri', val: 'push' },
          { label: '시트 데이터로 바꾸기', val: 'pull' },
          { label: '취소' }
        ], async function (v) {
          try { if (v === 'push') await push(); else pull(conflict); } catch (e) { fail(e); }
        });
      }
    }
    syncHook = function () {
      if (!ready() || !sw.checked) return;
      clearTimeout(timer);
      timer = setTimeout(sync, 3000);
    };
    btn.addEventListener('click', sync);
    sw.addEventListener('change', function () { ls('autoSync', sw.checked ? '1' : '0'); if (sw.checked) sync(); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden && sw.checked) sync(); });
    var b0 = +ls('syncBase') || 0;
    if (!ready()) say('웹 앱 URL(…/exec)을 입력해 주세요.');
    else if (b0) say('마지막 동기화: ' + stamp(b0));
    if (ls('autoSync') === '1') { sw.checked = true; if (ready()) sync(); }
  })();
  (function () {
    var list = document.getElementById('setlist'), back = document.getElementById('setback'), title = document.getElementById('settitle');
    var names = { 'sv-vault': '보관함', 'sv-sync': '동기화' };
    function show(id) {
      list.hidden = !!id;
      Object.keys(names).forEach(function (k) { document.getElementById(k).hidden = k !== id; });
      back.hidden = !id;
      title.textContent = id ? names[id] : '설정';
    }
    document.querySelectorAll('.srow').forEach(function (r) { r.addEventListener('click', function () { show(r.getAttribute('data-sv')); }); });
    back.addEventListener('click', function () { show(null); });
  })();
  var box = [];
  try { box = JSON.parse(localStorage.getItem('box') || '[]') || []; } catch (e) { box = []; }
  function saveB() { try { localStorage.setItem('box', JSON.stringify(box)); } catch (e) {} touch(); }
  function renderBox() {
    var el = document.getElementById('sv-vault');
    el.innerHTML = '';
    box.forEach(function (b, i) {
      var row = document.createElement('div');
      row.className = 'brow';
      var dot = document.createElement('i');
      dot.className = 'dot';
      if (b.color) dot.style.background = b.color;
      var tx = document.createElement('div');
      tx.className = 'bt';
      tx.textContent = b.text;
      if (b.memo) {
        var mm = document.createElement('small');
        mm.textContent = b.memo;
        tx.appendChild(mm);
      }
      row.addEventListener('click', function () { boxIdx = i; document.getElementById('ov6').classList.add('open'); });
      row.appendChild(dot);
      row.appendChild(tx);
      el.appendChild(row);
    });
  }
  document.getElementById('tbox').addEventListener('click', function () {
    if (!curItem || curItem.rep) return;
    var arr = store[dkey()], t = curItem.t;
    if (!arr || !arr[curItem.i]) return;
    box.push({ id: t.id, cat: t.cat || '', text: t.text, memo: t.memo || '', color: t.color || '' });
    arr.splice(curItem.i, 1);
    save();
    saveB();
    curItem = null;
    closeDetail();
    renderTodo();
    renderBox();
  });
  function closeBoxMenu() { document.getElementById('ov6').classList.remove('open'); }
  document.getElementById('ov6').addEventListener('click', function (e) { if (e.target === this) closeBoxMenu(); });
  document.getElementById('grab6').addEventListener('click', closeBoxMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBoxMenu(); });
  function moveBoxTo(i, nd) {
    var b = box[i];
    if (!b) return;
    var nk = nd.getFullYear() + '-' + (nd.getMonth() + 1) + '-' + nd.getDate();
    (store[nk] = store[nk] || []).push({ id: b.id, cat: b.cat || '', text: b.text, memo: b.memo || '', time: '', color: b.color || '', done: false });
    box.splice(i, 1);
    save();
    saveB();
    d = nd;
    render();
    renderBox();
  }
  document.getElementById('bt-today').addEventListener('click', function () {
    var i = boxIdx;
    closeBoxMenu();
    boxIdx = null;
    if (i !== null) moveBoxTo(i, new Date());
  });
  document.getElementById('bt-date').addEventListener('click', function () {
    if (boxIdx === null) return;
    closeBoxMenu();
    boxMv = true;
    var t0 = new Date();
    mvSel = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate());
    mvM = new Date(t0.getFullYear(), t0.getMonth(), 1);
    renderMv();
    document.getElementById('ov4').classList.add('open');
  });
  document.getElementById('bt-edit').addEventListener('click', function () {
    var b = box[boxIdx];
    closeBoxMenu();
    if (!b) return;
    var i = boxIdx;
    openSheet(null);
    boxEdit = i;
    cur.color = b.color || '';
    cur.name = b.cat || '';
    document.getElementById('sheet').classList.add('boxmode');
    document.getElementById('ttitle').value = b.text;
    if (b.memo) {
      document.getElementById('swmemo').checked = true;
      document.getElementById('fmemo').classList.add('open');
      document.getElementById('tmemo').value = b.memo;
    }
  });
  document.getElementById('bt-del').addEventListener('click', function () {
    var i = boxIdx;
    closeBoxMenu();
    if (i === null) return;
    askScope('보관함에서 삭제할까요?', [
      { label: '삭제', cls: 'dng', val: 'del' },
      { label: '취소' }
    ], function () { box.splice(i, 1); boxIdx = null; saveB(); renderBox(); });
  });
  (function () {
    var logs = document.getElementById('logs'), sheet = document.getElementById('logsheet');
    var segs = Array.prototype.slice.call(logs.querySelectorAll('.mseg i'));
    var pills = Array.prototype.slice.call(logs.querySelectorAll('.hpill'));
    var label = document.createElement('div');
    label.id = 'logsel';
    sheet.appendChild(label);
    var catBox = document.createElement('div');
    catBox.id = 'logcats';
    catBox.hidden = true;
    sheet.appendChild(catBox);
    var logCat = null, catColor = {}, logData = {};
    try { logData = JSON.parse(localStorage.getItem('logcats') || '{}') || {}; } catch (e) { logData = {}; }
    window.__log = { get: function () { return logData; }, set: function (v) { logData = v || {}; try { localStorage.setItem('logcats', JSON.stringify(logData)); } catch (e) {} } };
    function assign(name) {
      if (lo < 0) return;
      var k = String(selDate), day = logData[k] || (logData[k] = {});
      for (var m = lo; m <= hi; m++) { if (name) day[m] = name; else delete day[m]; }
      if (!Object.keys(day).length) delete logData[k];
      try { localStorage.setItem('logcats', JSON.stringify(logData)); } catch (e) {}
      touch();
      clear();
    }
    var lcats = [];
    document.querySelectorAll('#tab-todo .cat').forEach(function (c) {
      var dot = c.querySelector('.dot');
      lcats.push({ n: c.getAttribute('data-cat'), c: dot ? dot.style.background : '#888' });
    });
    lcats.push({ n: '잠', c: '#555555' }, { n: '준비', c: '#9C2F75' }, { n: '운동', c: '#5E9A6E' }, { n: '식사', c: '#7A5238' });
    lcats.forEach(function (c) {
      var name = c.n;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lcat';
      btn.setAttribute('data-c', name);
      var i = document.createElement('i');
      i.className = 'dot';
      i.style.background = c.c;
      btn.appendChild(i);
      btn.appendChild(document.createTextNode(name));
      catColor[name] = c.c;
      btn.addEventListener('click', function () { assign(name); });
      catBox.appendChild(btn);
    });
    var xb = document.createElement('button');
    xb.type = 'button';
    xb.className = 'lcat';
    xb.textContent = '지우기';
    xb.addEventListener('click', function () { assign(null); });
    catBox.appendChild(xb);
    function paintCat() {
      catBox.querySelectorAll('.lcat').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-c') === logCat); });
    }
    var anchor = 0, lo = -1, hi = -1, selDate = 0, active = false, timer = null, sx = 0, sy = 0, lastTouch = 0, mdown = false, moved = false;
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function fmt(v) { return pad(Math.floor(v / 60) % 24) + ':' + pad(v % 60); }
    function valAt(x, y) {
      var best = pills[0], bd = 1e9;
      pills.forEach(function (p) {
        var r = p.getBoundingClientRect(), dy = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);
        if (dy < bd) { bd = dy; best = p; }
      });
      var r = best.getBoundingClientRect();
      var m = Math.max(0, Math.min(59, Math.floor((x - r.left) / r.width * 60)));
      return (+best.getAttribute('data-h')) * 60 + m;
    }
    function paint() {
      var day = logData[dn(d)] || {};
      segs.forEach(function (s, i) {
        var on = lo >= 0 && i >= lo && i <= hi, c = catColor[day[i]];
        s.classList.toggle('sel', on);
        s.style.background = (!on && c) ? c : '';
      });
      catBox.hidden = lo < 0;
      if (lo < 0) { label.textContent = ''; logCat = null; paintCat(); return; }
      var len = hi - lo + 1, h = Math.floor(len / 60), m = len % 60;
      label.textContent = fmt(lo) + ' - ' + fmt(hi + 1) + ' (' + ((h ? h + '시간 ' : '') + (m ? m + '분' : '')).trim() + ')';
    }
    function clear() { lo = hi = -1; paint(); }
    function begin(x, y) { anchor = valAt(x, y); lo = hi = anchor; selDate = dn(d); active = true; dragging = true; paint(); }
    function move(x, y) { var v = valAt(x, y); lo = Math.min(anchor, v); hi = Math.max(anchor, v); paint(); }
    function end() { active = false; dragging = false; }
    logSelSync = function () { if (lo >= 0 && selDate !== dn(d)) clear(); else paint(); };
    logs.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    logs.addEventListener('touchstart', function (e) {
      lastTouch = Date.now();
      clearTimeout(timer); timer = null;
      if (e.touches.length !== 1) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      timer = setTimeout(function () {
        timer = null;
        begin(sx, sy);
        try { if (navigator.vibrate) navigator.vibrate(10); } catch (x) {}
      }, 250);
    }, { passive: true });
    logs.addEventListener('touchmove', function (e) {
      lastTouch = Date.now();
      var t = e.touches[0];
      if (active) { e.preventDefault(); move(t.clientX, t.clientY); return; }
      if (timer && (Math.abs(t.clientX - sx) > 8 || Math.abs(t.clientY - sy) > 8)) { clearTimeout(timer); timer = null; }
    }, { passive: false });
    logs.addEventListener('touchend', function () {
      lastTouch = Date.now();
      if (timer) { clearTimeout(timer); timer = null; clear(); }
      end();
    });
    logs.addEventListener('touchcancel', function () { clearTimeout(timer); timer = null; end(); });
    logs.addEventListener('mousedown', function (e) {
      if (Date.now() - lastTouch < 600 || e.button !== 0) return;
      mdown = true; moved = false;
      begin(e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', function (e) { if (!mdown) return; moved = true; move(e.clientX, e.clientY); });
    document.addEventListener('mouseup', function () {
      if (!mdown) return;
      mdown = false;
      if (!moved) clear();
      end();
    });
  })();
  renderBox();
  paintT('tstart');
  paintT('tend');
  render();
</script>
